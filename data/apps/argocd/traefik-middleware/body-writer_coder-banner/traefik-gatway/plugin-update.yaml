---
# 1. Strip Compression & Bypass Backend Cache
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-compression
  namespace: coder
spec:
  headers:
    customRequestHeaders:
      Accept-Encoding: "identity" # Enforces uncompressed responses
      If-None-Match: ""
      If-Modified-Since: ""

---
# 2. Inject Banner & CSS
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: banner
  namespace: coder
spec:
  plugin:
    rewrite-body:
      lastModified: true
      rewrites:
        # Inject Banner as the first child of the body tag
        - regex: "(?i)(<body[^>]*>)"
          replacement: '$1<div style="background-color: #0f766e; color: #ffffff; padding: 12px 20px; font-family: sans-serif; font-size: 14px; font-weight: 500; display: flex; align-items: center; justify-content: space-between; z-index: 99999; position: relative; width: 100%; box-sizing: border-box; flex-shrink: 0;"><span>Reminder: your subscription expires in 22 days. Renew to avoid account suspension.</span></div>'

        # Inject CSS into the <head> to hide the Codernauts menu link
        - regex: "(?i)(</head>)"
          replacement: '<style>a[href="/coder-cup"] { display: none !important; }</style>$1'

---
# 3. The Ordered Chain
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: banner-chain
  namespace: coder
spec:
  chain:
    middlewares:
      - name: strip-compression
      - name: banner

---
# 4. The Route
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: coder
  namespace: coder
spec:
  hostnames:
    - coder.xxx.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: banner-chain
      backendRefs:
        - group: ""
          kind: Service
          name: coder-coder
          port: 80
          weight: 1
