providers:
  kubernetesIngress:
    enabled: false
  kubernetesGateway:
    enabled: true
    experimentalChannel: false

ports:
  web:
    port: 80
    expose:
      default: true
  websecure:
    port: 443
    expose:
      default: true

gateway:
  enabled: true
  listeners:
    web:
      port: 80
      namespacePolicy:
        from: All
    websecure:
      enabled: true
      port: 443
      protocol: HTTPS
      mode: Terminate
      certificateRefs:
      - name: traefik-wildcard-cert
      options:
        name: mtls-options
        namespace: traefik
