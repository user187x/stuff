metadata:
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
  name: traefik
spec:
  destination:
    namespace: traefik
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: traefik
    helm:
      values: "providers:\n  kubernetesGateway:\n    enabled: true\n  kubernetesIngress:\n\
        \    enabled: false\n\ngatewayClass:\n  enabled: true\n  name: traefik\n\n\
        gateway:\n  enabled: true\n  name: traefik-gateway\n  listeners:\n    web:\n\
        \      port: 8000\n      protocol: HTTP\n      namespacePolicy:\n        from:\
        \ All\n\n    websecure:\n      port: 8443\n      protocol: HTTPS\n      namespacePolicy:\n\
        \        from: All\n      certificateRefs:\n        - kind: Secret\n     \
        \     name: wildcard-tls\n"
    repoURL: https://traefik.github.io/charts
    targetRevision: '*'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
