apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: excalidraw
  namespace: excalidraw
spec:
  hostnames:
    - excalidraw.xxx.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        # 1. NATIVE Gateway API: Strips the compression and caching headers
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - Accept-Encoding
              - If-None-Match
              - If-Modified-Since

        # 2. TRAEFIK Extension: Points ONLY to the rewritebody middleware, NOT the chain
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: banner

      backendRefs:
        - group: ""
          kind: Service
          name: excalidraw
          port: 80
          weight: 1
