# Default values for pre-auth-shim

namespace: pre-auth-shim

backendService:
  name: headlamp
  namespace: headlamp
  port: 80

middleware:
  spec:
    forwardAuth:
      address: http://pre-auth-shim-svc.pre-auth-shim.svc.cluster.local/auth

httproute:
  spec:
    hostname: protected.xxx.local

dashboard:
  hostname: auth.xxx.local
