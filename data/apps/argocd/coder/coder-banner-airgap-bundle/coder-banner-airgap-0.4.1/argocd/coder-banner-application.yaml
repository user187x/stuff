# Argo CD Application that installs the coder-banner chart from the cluster's internal Helm chart repository.
#
# Prerequisites (see BANNER-AIRGAP.md):
#   1. coder-banner-<version>.tgz is uploaded to the internal chart repository, and Argo CD has that repository
#      registered (with its CA in argocd-tls-certs-cm if it uses your local PKI).
#   2. Traefik's rewrite-body plugin is enabled (static config, so no chart can do it):
#        ./support/traefik/enable-plugin --airgap
#   3. The banner image is available in your registry (set image.registry below).
#
#   kubectl apply -f coder-banner-argocd.yaml
# Remove it (and ONLY what the chart created) again with:   kubectl -n argocd delete application coder-banner
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: coder-banner          # also the Helm release name
  namespace: argocd
  finalizers:
    # Deleting the Application deletes what it created (the banner) and nothing else: Coder, its route and
    # the coder namespace belong to other Applications and are never touched.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.internal.example.com   # <-- CHANGE ME: your internal Helm repository
    chart: coder-banner
    targetRevision: 0.4.1
    # OCI registry instead (e.g. Harbor)?  repoURL: registry.internal.example.com/charts   (register it in Argo CD
    # as an OCI repository); keep chart: coder-banner.
    helm:
      releaseName: coder-banner
      # Only what differs from the chart defaults. Everything is documented in the chart's values.yaml.
      valuesObject:
        coder:
          host: coder.xxx.com                      # <-- the hostname Coder is served on
          service:
            name: coder
            port: 80
        gateway:
          name: traefik-gateway
          namespace: traefik
        image:
          registry: registry.internal.example.com  # <-- CHANGE ME: where you loaded the python image
          repository: library/python
          tag: 3.13-alpine
        # imagePullSecrets:
        #   - name: internal-registry
        admin:
          roles: [owner]                           # Coder roles allowed to edit the banner
  destination:
    server: https://kubernetes.default.svc
    namespace: coder                               # the namespace Coder runs in (must already exist)
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Deliberately NOT CreateNamespace: the namespace belongs to Coder, not to the banner.
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
  # coder-banner-state holds what an admin publishes from the admin page. The chart only renders its metadata;
  # the banner service writes .data at runtime. Argo CD v3.5 ignores such live-only fields anyway (tested:
  # no OutOfSync and nothing reverted with or without this rule) - it stays as insurance for Argo CD versions
  # or diff strategies (e.g. server-side diff) that compare them.
  ignoreDifferences:
    - group: ""
      kind: ConfigMap
      name: coder-banner-state
      jsonPointers:
        - /data
