---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-backup-sa
  namespace: argocd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-backup-clusterrole
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-backup-clusterrolebinding
subjects:
  - kind: ServiceAccount
    name: argocd-backup-sa
    namespace: argocd # The SA still lives in the argocd namespace
roleRef:
  kind: ClusterRole
  name: argocd-backup-clusterrole
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: argocd-s3-backup
  namespace: argocd
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: argocd-backup-sa
          restartPolicy: OnFailure
          volumes:
            - name: shared-backup-vol
              emptyDir: {}
          
          # STEP 1: Export ArgoCD state using the official image
          initContainers:
            - name: argocd-export
              image: quay.io/argoproj/argocd:v2.10.4 # Pin to your current ArgoCD version
              command:
                - /bin/bash
                - -c
              args:
                - |
                  echo "Starting ArgoCD Admin Export..."
                  argocd admin export -n argocd > /backup/full-argocd-backup.yaml
                  echo "Export complete."
              volumeMounts:
                - name: shared-backup-vol
                  mountPath: /backup

          # STEP 2: Push to S3 using the official AWS CLI image
          containers:
            - name: s3-push
              image: amazon/aws-cli:latest
              command:
                - /bin/bash
                - -c
              args:
                - |
                  set -e
                  TIMESTAMP=$(date +%Y-%m-%d-%H-%M-%S)
                  FILENAME="full-argocd-backup-${TIMESTAMP}.yaml"
                  DESTINATION="s3://argocd-backups/${FILENAME}"
                  
                  echo "Pushing backup to ${DESTINATION}..."
                  aws s3 cp /backup/full-argocd-backup.yaml "${DESTINATION}"
                  echo "Backup successfully pushed to S3."
              volumeMounts:
                - name: shared-backup-vol
                  mountPath: /backup
