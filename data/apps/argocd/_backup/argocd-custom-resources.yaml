apiVersion: v1
items:
  - apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: argocd-image-updater
      namespace: argocd
    spec:
      destination:
        namespace: argocd
        server: https://kubernetes.default.svc
      project: default
      source:
        chart: argocd-image-updater
        repoURL: https://argoproj.github.io/argo-helm
        targetRevision: 1.2.4
  - apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: beekeeper
      namespace: argocd
    spec:
      destination:
        namespace: beekeeper
        server: https://kubernetes.default.svc
      project: default
      source:
        chart: beekeeper
        helm:
          parameters:
            - name: config.initPing.clusterName
              value: coder-shroder
          values: "enable-k8s: false\nconfig-dir: \"~/.beekeeper\"\n\nparameters:\n\
            \        - name: \"clusterName\" \n          value: \"coder-shroder\""
        repoURL: https://ethersphere.github.io/helm
        targetRevision: 0.4.12
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
  - apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: cloudbeaver
      namespace: argocd
    spec:
      destination:
        namespace: cloudbeaver
        server: https://kubernetes.default.svc
      project: default
      source:
        chart: cloudbeaver
        repoURL: https://avistotelecom.github.io/charts/
        targetRevision: 1.1.7
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
  - apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: cloudnative-pag
      namespace: argocd
    spec:
      destination:
        namespace: cnpg-system
        server: https://kubernetes.default.svc
      project: default
      source:
        chart: cloudnative-pg
        repoURL: https://cloudnative-pg.io/charts/
        targetRevision: 0.29.0
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
  - apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: coder
      namespace: argocd
    spec:
      destination:
        namespace: coder
        server: https://kubernetes.default.svc
      project: default
      source:
        chart: coder
        repoURL: https://helm.coder.com/v2
        targetRevision: 2.35.2
  - apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: comfyui
      namespace: argocd
    spec:
      destination:
        namespace: comfyui
        server: https://kubernetes.default.svc
      project: default
      source:
        chart: comfyui
        helm:
          parameters:
            - name: gpu.enabled
              value: 'false'
            - name: service.type
              value: LoadBalancer
          values: "# Inject the startup argument via the environment variable \n#\
            \ expected by the underlying Docker image\nenv:\n  - name: CLI_ARGS\n\
            \    value: \"--cpu\"\n\nroute:\n  enabled: true\n  hostnames:\n    -\
            \ comfyui.xxx.local\n  parentRefs:\n    - name: traefik-gateway\n    \
            \  namespace: traefik\n      sectionName: websecure\npersistence:\n  enabled:\
            \ true\n  storageClass: \"standard\"\n  accessMode: ReadWriteOnce\n  size:\
            \ 20Gi"
        repoURL: https://mmmateusz.github.io/comfyui-helm-chart
        targetRevision: 0.7.0
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
  - apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      annotations:
        argocd.argoproj.io/sync-wave: '-3'
      name: gateway-api-crds
      namespace: argocd
    spec:
      destination:
        namespace: kube-system
        server: https://kubernetes.default.svc
      project: default
      source:
        path: config/crd/standard
        repoURL: https://github.com/kubernetes-sigs/gateway-api.git
        targetRevision: v1.6.0
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
  - apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      annotations: {}
      name: gitlab
      namespace: argocd
    spec:
      destination:
        namespace: gitlab
        server: https://kubernetes.default.svc
      project: default
      source:
        chart: gitlab
        helm:
          values: "global:\n  hosts:\n    domain: xxx.local\n    https: false\n  ingress:\n\
            \    enabled: false\n    configureCertmanager: false\n    # Prevent fallback\
            \ self-signed certificate generation\n    tls:\n      enabled: false\n\
            \nnginx-ingress:\n  enabled: false\n\ninstallCertmanager: false\n\n# Satisfy\
            \ the chart's strict template validation (value is ignored)\ncertmanager-issuer:\n\
            \  email: \"admin@xxx.local\"\n"
        repoURL: https://charts.gitlab.io/
        targetRevision: 10.2.0
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
  - apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: harbor
      namespace: argocd
    spec:
      destination:
        namespace: harbor
        server: https://kubernetes.default.svc
      project: default
      source:
        chart: harbor
        helm:
          parameters:
            - name: caSecretName
              value: tls-ca
          values: "        expose:\n          type: httproute\n          tls:\n  \
            \          enabled: false\n          route:\n            hosts:\n    \
            \          - harbor.xxx.local\n            parentRefs:\n             \
            \ - name: traefik-gateway\n                namespace: traefik\n      \
            \          sectionName: websecure\n        \n        externalURL: https://harbor.xxx.local\n\
            \        \n        # Production features enabled\n        trivy:\n   \
            \       enabled: true\n        notary:\n          enabled: true\n    \
            \    chartmuseum:\n          enabled: true\n          \n        persistence:\n\
            \          persistentVolumeClaim:\n            registry:\n           \
            \   size: 50Gi\n            chartmuseum:\n              size: 10Gi\n \
            \           jobservice:\n              size: 5Gi\n            database:\n\
            \              size: 10Gi\n            redis:\n              size: 5Gi\n\
            \            trivy:\n              size: 10Gi\n              \n      \
            \  harborAdminPassword: \"ChangeMeToAStrongPassword123!\""
        repoURL: https://helm.goharbor.io
        targetRevision: 1.19.1
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
  - apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: headlamp
      namespace: argocd
    spec:
      destination:
        namespace: headlamp
        server: https://kubernetes.default.svc
      project: default
      source:
        chart: headlamp
        helm:
          values: "helm:\n      valuesObject:\n        config:\n          # Bypasses\
            \ the token prompt by authenticating as the Pod's ServiceAccount\n   \
            \       unsafeUseServiceAccountToken: true\n        \n        clusterRoleBinding:\n\
            \          create: true\n          # Newer chart versions default to 'view'.\
            \ \n          # Set to 'cluster-admin' if you need full read/write access\
            \ in the UI.\n          clusterRoleName: cluster-admin\n          namespace:\
            \ headlamp"
        repoURL: https://kubernetes-sigs.github.io/headlamp/
        targetRevision: 0.43.0
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
  - apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: keycloak
      namespace: argocd
    spec:
      destination:
        namespace: keycloak
        server: https://kubernetes.default.svc
      project: default
      source:
        path: kubernetes
        repoURL: https://github.com/keycloak/keycloak-quickstarts.git
        targetRevision: main
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
  - apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      annotations:
        argocd.argoproj.io/sync-wave: '-2'
      name: traefik
      namespace: argocd
    spec:
      destination:
        namespace: traefik
        server: https://kubernetes.default.svc
      project: default
      source:
        chart: traefik
        helm:
          values: "providers:\n  kubernetesGateway:\n    enabled: true\n  kubernetesIngress:\n\
            \    enabled: false\n\ngatewayClass:\n  enabled: true\n  name: traefik\n\
            \ngateway:\n  enabled: true\n  name: traefik-gateway\n  listeners:\n \
            \   web:\n      port: 8000\n      protocol: HTTP\n      namespacePolicy:\n\
            \        from: All\n\n    websecure:\n      port: 8443\n      protocol:\
            \ HTTPS\n      namespacePolicy:\n        from: All\n      certificateRefs:\n\
            \        - kind: Secret\n          name: wildcard-tls\n"
        repoURL: https://traefik.github.io/charts
        targetRevision: '*'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
  - apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: default
      namespace: argocd
    spec:
      clusterResourceWhitelist:
        - group: '*'
          kind: '*'
      destinations:
        - namespace: '*'
          server: '*'
      sourceRepos:
        - '*'
kind: List
metadata:
  resourceVersion: ''
