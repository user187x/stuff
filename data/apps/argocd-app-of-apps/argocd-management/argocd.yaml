apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-management
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/user187x/argocd.git'
    targetRevision: HEAD
    path: /argocd-management
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
