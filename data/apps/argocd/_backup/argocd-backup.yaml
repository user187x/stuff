apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: comfyui
spec:
  destination:
    namespace: comfyui
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: comfyui
    helm:
      parameters:
        - name: gpu.enabled
          value: 'false'
        - name: service.type
          value: LoadBalancer
      values: "# Inject the startup argument via the environment variable \n# expected\
        \ by the underlying Docker image\nenv:\n  - name: CLI_ARGS\n    value: \"\
        --cpu\"\n\nroute:\n  enabled: true\n  hostnames:\n    - comfyui.xxx.local\n\
        \  parentRefs:\n    - name: traefik-gateway\n      namespace: traefik\n  \
        \    sectionName: websecure\npersistence:\n  enabled: true\n  storageClass:\
        \ \"standard\"\n  accessMode: ReadWriteOnce\n  size: 20Gi"
    repoURL: https://mmmateusz.github.io/comfyui-helm-chart
    targetRevision: 0.7.0
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: '-3'
  name: gateway-api-crds
spec:
  destination:
    namespace: kube-system
    server: https://kubernetes.default.svc
  project: default
  source:
    path: config/crd/standard
    repoURL: https://github.com/kubernetes-sigs/gateway-api.git
    targetRevision: v1.6.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations: {}
  name: gitlab
spec:
  destination:
    namespace: gitlab
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: gitlab
    helm:
      values: "global:\n  hosts:\n    domain: xxx.local\n    https: false\n  ingress:\n\
        \    enabled: false\n    configureCertmanager: false\n    # Prevent fallback\
        \ self-signed certificate generation\n    tls:\n      enabled: false\n\nnginx-ingress:\n\
        \  enabled: false\n\ninstallCertmanager: false\n\n# Satisfy the chart's strict\
        \ template validation (value is ignored)\ncertmanager-issuer:\n  email: \"\
        admin@xxx.local\"\n"
    repoURL: https://charts.gitlab.io/
    targetRevision: 10.2.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor
spec:
  destination:
    namespace: harbor
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: harbor
    helm:
      parameters:
        - name: caSecretName
          value: tls-ca
      values: "        expose:\n          type: httproute\n          tls:\n      \
        \      enabled: false\n          route:\n            hosts:\n            \
        \  - harbor.xxx.local\n            parentRefs:\n              - name: traefik-gateway\n\
        \                namespace: traefik\n                sectionName: websecure\n\
        \        \n        externalURL: https://harbor.xxx.local\n        \n     \
        \   # Production features enabled\n        trivy:\n          enabled: true\n\
        \        notary:\n          enabled: true\n        chartmuseum:\n        \
        \  enabled: true\n          \n        persistence:\n          persistentVolumeClaim:\n\
        \            registry:\n              size: 50Gi\n            chartmuseum:\n\
        \              size: 10Gi\n            jobservice:\n              size: 5Gi\n\
        \            database:\n              size: 10Gi\n            redis:\n   \
        \           size: 5Gi\n            trivy:\n              size: 10Gi\n    \
        \          \n        harborAdminPassword: \"ChangeMeToAStrongPassword123!\""
    repoURL: https://helm.goharbor.io
    targetRevision: 1.19.1
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp
spec:
  destination:
    namespace: headlamp
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: headlamp
    helm:
      values: "helm:\n      valuesObject:\n        config:\n          # Bypasses the\
        \ token prompt by authenticating as the Pod's ServiceAccount\n          unsafeUseServiceAccountToken:\
        \ true\n        \n        clusterRoleBinding:\n          create: true\n  \
        \        # Newer chart versions default to 'view'. \n          # Set to 'cluster-admin'\
        \ if you need full read/write access in the UI.\n          clusterRoleName:\
        \ cluster-admin\n          namespace: headlamp"
    repoURL: https://kubernetes-sigs.github.io/headlamp/
    targetRevision: 0.43.0
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
---
