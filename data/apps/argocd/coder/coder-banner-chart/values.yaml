# Namespace of the Coder release (Middleware/HTTPRoute must live next to the Coder Service).
namespace: ""   # defaults to "coder"

coder:
  host: coder.xxx.com
  service:
    name: coder
    port: 80

gateway:
  name: traefik-gateway
  namespace: traefik

plugin:
  # Must match the key under `experimental.plugins` in Traefik's static config
  # (see ../support/traefik/rewrite-body-plugin.yaml).
  name: rewrite-body

# Path prefixes that are never rewritten. Workspace apps (code-server, noVNC, ...) serve their
# own HTML under /@user/workspace.agent/apps/..., so they bypass the middleware entirely.
passthroughPathPrefixes:
  - /@

# Static file server for the loader script and banner.json (must be same-origin: Coder's CSP is
# script-src 'self').
image: nginxinc/nginx-unprivileged:1.27-alpine

# ---- The banner itself. Edit and `helm upgrade`, or `kubectl edit cm coder-banner-content`. ----
banner:
  enabled: true
  level: info            # info | success | warning | critical
  title: ""              # optional bold lead-in
  message: "Scheduled maintenance: Coder will be briefly unavailable this Saturday from 02:00 to 03:00 UTC."
  linkText: ""           # optional link, shown after the message
  linkUrl: ""            # http(s):// or /path
  dismissible: true
  # Users who dismissed the banner see it again when this changes. Empty = derived from the
  # level/title/message/link, so editing the text re-shows it automatically.
  id: ""
  # Coder's login page has no header to anchor under, so show the banner above the page instead.
  showOnLoginPage: true
  refreshSeconds: 60     # how often open browser tabs re-check banner.json (min 15)
