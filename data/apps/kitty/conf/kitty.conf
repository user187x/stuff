# vim: set ft=kitty :

# ==============================================================================
# Fonts
# ==============================================================================
font_family      "JetBrains Mono"
font_size        13
bold_font        auto
italic_font      auto
bold_italic_font auto

# ==============================================================================
# Cursor
# ==============================================================================
cursor_shape                 beam
cursor                       #ff8c00
cursor_text_color            #000000
# Enable the cursor trail (set to a value greater than 0)
cursor_trail                 10
# Control how long the trail lasts (higher values = longer trail)
cursor_trail_decay           0.1 0.45
# Minimum distance (in cells) the cursor must move to trigger a trail
cursor_trail_start_threshold 2

# ==============================================================================
# Scrollback & Mouse
# ==============================================================================
scrollback_lines       2000
wheel_scroll_min_lines 1
mouse_map right press ungrabbed copy_to_clipboard

# ==============================================================================
# Window Layout & Borders
# ==============================================================================
window_border_width     4
window_padding_width    4
draw_minimal_borders    no
hide_window_decorations no
confirm_os_window_close 0

# ==============================================================================
# Colors & Transparency
# ==============================================================================
background_opacity         0.95
background_blur            20
dynamic_background_opacity yes

active_border_color   #00ff00
inactive_border_color #444444

# ==============================================================================
# Bell Settings
# ==============================================================================
enable_audio_bell    yes
window_alert_on_bell yes
bell_border_color    #ff0000
visual_bell_duration 0.1
visual_bell_color    #ff00ff

# ==============================================================================
# Advanced & Shell
# ==============================================================================
linux_display_server x11

shell                tmux new-session -A -s main
shell_integration    no-title
allow_remote_control yes
close_on_child_death yes

# ==============================================================================
# Theme
# ==============================================================================
# Automatically applies the theme managed by `kitty +kitten themes`
include current-theme.conf
