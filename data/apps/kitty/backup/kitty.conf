include ../themes/nord.conf

shell tmux new-session -A -s main
mouse_map right press ungrabbed copy_to_clipboard

font_family FantasqueSansM Nerd Font Mono
font_size 12.5
bold_font auto
italic_font auto
bold_italic_font auto

background_opacity 0.95
dynamic_background_opacity yes

confirm_os_window_close 0
close_on_child_death yes

# Animated cursor
cursor_trail 5
cursor_shape beam
cursor_trail_decay 0.2 0.5
visual_bell_duration 0.8
visual_bell_color white
window_alert_on_bell yes

# change to x11 or wayland or leave auto
linux_display_server x11
allow_remote_control yes

# Set a blank/empty window title
title_template " "

shell_integration no-title
#hide_window_decorations titlebar-only

scrollback_lines 2000
wheel_scroll_min_lines 1

enable_audio_bell yes

window_padding_width 4
# selection_foreground none
# selection_background none

# foreground/background/cursor are set by the active theme

include current-theme.conf
