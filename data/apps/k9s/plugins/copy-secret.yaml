plugins:
  copy-secret:
    shortCut: Shift-C
    confirm: false
    description: "Copy Secret to Namespace (fzf)"
    scopes:
      - secrets
    command: bash
    background: false
    args:
      - -c
      - |
        # Fetch namespaces from the ACTIVE K9s context
        target_ns=$(kubectl get namespaces --context "$CONTEXT" -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' | fzf --prompt="Copy secret '$NAME' to namespace> ")

        if [ -z "$target_ns" ]; then
          echo "Aborted. No namespace selected."
          sleep 2
          exit 0
        fi

        echo "Copying '$NAME' from '$NAMESPACE' to '$target_ns' in context '$CONTEXT'..."

        # Use the active context for fetching and applying
        kubectl get secret $NAME --context "$CONTEXT" -n $NAMESPACE -o json | \
        jq 'del(.metadata.namespace, .metadata.uid, .metadata.resourceVersion, .metadata.creationTimestamp, .metadata.managedFields)' | \
        kubectl apply --context "$CONTEXT" -n "$target_ns" -f -

        echo -e "\nPress any key to close..."
        read -n 1 -s < /dev/tty
