apiVersion: apps/v1
kind: Deployment
metadata:
  name: coder-banner
  namespace: {{ include "coder-banner.namespace" . }}
  labels:
    {{- include "coder-banner.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: coder-banner
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "coder-banner.labels" . | nindent 8 }}
      annotations:
        # Restart only when the static files change; banner.json edits are picked up live.
        checksum/static: {{ print (.Files.Get "files/banner.js") (.Files.Get "files/nginx.conf") | sha256sum | trunc 16 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: {{ .Values.image }}
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
            - name: static
              mountPath: /usr/share/banner/static
            - name: content
              mountPath: /usr/share/banner/content
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-conf
          configMap:
            name: coder-banner-static
            items: [{ key: nginx.conf, path: nginx.conf }]
        - name: static
          configMap:
            name: coder-banner-static
            items: [{ key: banner.js, path: banner.js }]
        - name: content
          configMap:
            name: coder-banner-content
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: coder-banner
  namespace: {{ include "coder-banner.namespace" . }}
  labels:
    {{- include "coder-banner.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: coder-banner
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: http
