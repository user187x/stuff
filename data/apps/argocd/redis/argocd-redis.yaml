apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis
  namespace: argocd
    spec:
      project: default
      source:
        repoURL: https://ot-container-kit.github.io/helm-charts
        chart: redis
        targetRevision: 0.16.9
      destination:
        server: https://kubernetes.default.svc
        namespace: redis
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
