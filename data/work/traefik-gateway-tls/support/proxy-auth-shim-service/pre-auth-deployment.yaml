---
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-shim-source
  namespace: traefik
data:
  ProxyAuthShim.java: |
    import com.sun.net.httpserver.HttpServer;
    import com.sun.net.httpserver.HttpHandler;
    import com.sun.net.httpserver.HttpExchange;
    import java.io.IOException;
    import java.io.OutputStream;
    import java.net.InetSocketAddress;
    import java.net.URI;
    import java.net.http.HttpClient;
    import java.net.http.HttpRequest;
    import java.net.http.HttpResponse;
    import java.time.Duration;

    public class ProxyAuthShim {
        // Initialize a reusable HTTP Client
        private static final HttpClient httpClient = HttpClient.newBuilder()
                .connectTimeout(Duration.ofSeconds(5))
                .build();

        public static void main(String[] args) throws IOException {
            int port = 8080;
            
            // Pull the URLs from the Deployment environment variables
            String keycloakUrl = System.getenv().getOrDefault("KEYCLOAK_AUTH_URL", "http://keycloak.default.svc.cluster.local:8080/realms/master/protocol/openid-connect/userinfo");
            String externalApiUrl = System.getenv().getOrDefault("EXTERNAL_API_URL", "https://api.external-provider.com/validate");

            HttpServer server = HttpServer.create(new InetSocketAddress(port), 0);

            server.createContext("/verify", new HttpHandler() {
                @Override
                public void handle(HttpExchange exchange) throws IOException {
                    // Extract the Authorization header
                    String authHeader = exchange.getRequestHeaders().getFirst("Authorization");

                    if (authHeader == null || authHeader.isEmpty()) {
                        sendResponse(exchange, 401, "Missing Authorization Header");
                        return;
                    }

                    try {
                        // ==========================================
                        // 1. Check Internal Keycloak Service
                        // ==========================================
                        HttpRequest keycloakReq = HttpRequest.newBuilder()
                                .uri(URI.create(keycloakUrl))
                                .header("Authorization", authHeader)
                                .GET()
                                .build();

                        HttpResponse<String> keycloakRes = httpClient.send(keycloakReq, HttpResponse.BodyHandlers.ofString());
                        
                        if (keycloakRes.statusCode() != 200) {
                            sendResponse(exchange, 401, "Unauthorized by Internal Keycloak");
                            System.out.println("Validation failed at Keycloak for: " + exchange.getRemoteAddress());
                            return;
                        }

                        // ==========================================
                        // 2. Check External 3rd Party API
                        // ==========================================
                        HttpRequest externalReq = HttpRequest.newBuilder()
                                .uri(URI.create(externalApiUrl))
                                .header("Authorization", authHeader)
                                .GET()
                                .build();

                        HttpResponse<String> externalRes = httpClient.send(externalReq, HttpResponse.BodyHandlers.ofString());
                        
                        if (externalRes.statusCode() != 200) {
                            sendResponse(exchange, 401, "Unauthorized by External API");
                            System.out.println("Validation failed at External API for: " + exchange.getRemoteAddress());
                            return;
                        }

                        // ==========================================
                        // 3. Success - Both services approved
                        // ==========================================
                        // Note: You can parse keycloakRes.body() here using a JSON library 
                        // to extract real usernames/roles to inject dynamically.
                        exchange.getResponseHeaders().add("X-Forwarded-User", "verified-user");
                        
                        sendResponse(exchange, 200, "Authorized");
                        System.out.println("Validation successful for: " + exchange.getRemoteAddress());

                    } catch (InterruptedException e) {
                        sendResponse(exchange, 500, "Internal Server Error");
                    }
                }
            });

            server.setExecutor(null);
            server.start();
            System.out.println("Proxy Auth Shim listening on port " + port);
            System.out.println(" -> Keycloak URL: " + keycloakUrl);
            System.out.println(" -> External API URL: " + externalApiUrl);
        }

        private static void sendResponse(HttpExchange exchange, int statusCode, String response) throws IOException {
            exchange.sendResponseHeaders(statusCode, response.getBytes().length);
            OutputStream os = exchange.getResponseBody();
            os.write(response.getBytes());
            os.close();
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-auth-shim
  namespace: traefik
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-auth-shim
  template:
    metadata:
      labels:
        app: platform-auth-shim
    spec:
      containers:
      - name: shim
        image: openjdk:17-slim
        command: ["java", "/app/ProxyAuthShim.java"]
        env:
        # Define the cluster-internal URL for your Keycloak service
        - name: KEYCLOAK_AUTH_URL
          value: "http://keycloak.your-namespace.svc.cluster.local:8080/realms/your-realm/protocol/openid-connect/userinfo"
        # Define the external 3rd party REST API URL
        - name: EXTERNAL_API_URL
          value: "https://your-actual-auth-provider.com/api/validate"
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: source-volume
          mountPath: /app
      volumes:
      - name: source-volume
        configMap:
          name: auth-shim-source
---
apiVersion: v1
kind: Service
metadata:
  name: platform-auth-shim
  namespace: traefik
spec:
  selector:
    app: platform-auth-shim
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
