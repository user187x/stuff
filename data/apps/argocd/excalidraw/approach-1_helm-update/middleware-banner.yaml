apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: banner
  namespace: excalidraw
spec:
  plugin:
    rewritebody:
      lastModified: true
      rewrites:
        - regex: "<body>"
          replacement: '<body><style>#root{...}</style><div id="subscription-banner">{{ .Values.bannerText }}</div>'
