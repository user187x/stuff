apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.min.io/
  chart: minio
  targetRevision: 5.4.0
  helm:
    values: |2-
              mode: standalone
              persistence:
                enabled: true
                size: 10Gi
              requests:
                memory: 512Mi
destination:
  server: https://kubernetes.default.svc
  namespace: minio
syncPolicy:
  syncOptions:
    - CreateNamespace=true
