---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-backup-sa
  namespace: argocd

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-backup-clusterrole
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-backup-clusterrolebinding
subjects:
  - kind: ServiceAccount
    name: argocd-backup-sa
    namespace: argocd
roleRef:
  kind: ClusterRole
  name: argocd-backup-clusterrole
  apiGroup: rbac.authorization.k8s.io

---
# 1. Request standard block storage
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: argocd-backup-pvc
  namespace: argocd
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi # Adjust this size based on your cluster's configuration scale
  # If omitted, uses the cluster's default storage class (e.g., 'standard' in Minikube)

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: argocd-pv-backup
  namespace: argocd
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: argocd-backup-sa
          restartPolicy: OnFailure
          
          # 2. Attach the PVC to the Pod
          volumes:
            - name: block-backup-vol
              persistentVolumeClaim:
                claimName: argocd-backup-pvc
          
          containers:
            - name: argocd-export
              image: quay.io/argoproj/argocd:v2.10.4
              command:
                - /bin/bash
                - -c
              args:
                - |
                  set -e
                  TIMESTAMP=$(date +%Y-%m-%d-%H-%M-%S)
                  FILENAME="full-argocd-backup-${TIMESTAMP}.yaml"
                  DESTINATION="/backup/${FILENAME}"
                  
                  echo "Starting ArgoCD Admin Export..."
                  argocd admin export -n argocd > "${DESTINATION}"
                  echo "Export complete. File saved to PV at ${DESTINATION}"
                  
                  # Optional: Keep only the 7 most recent backups to prevent disk exhaustion
                  ls -tp /backup/full-argocd-backup-*.yaml | grep -v '/$' | tail -n +8 | xargs -I {} rm -- {}
              
              # 3. Mount the attached PVC into the container's filesystem
              volumeMounts:
                - name: block-backup-vol
                  mountPath: /backup
