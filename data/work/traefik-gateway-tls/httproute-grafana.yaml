apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-route
  namespace: monitoring # Or 'grafana', depending on your deployment
spec:
  parentRefs:
  - name: traefik
    namespace: traefik-system 
  hostnames:
  - "grafana.feed.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: grafana # If using kube-prometheus-stack, this might be named something like 'prometheus-grafana'
      port: 80
