#   1. Application: nifikop operator
#   2. Application: zookeeper
#   3. Application: nifi-cluster
#   4. The manifests that git path should contain:
#        - Namespace
#        - NifiCluster CR
#        - HTTPRoute
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nifikop
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: ghcr.io/konpyutaika/helm-charts
    chart: nifikop
    targetRevision: 1.15.1          # check latest: https://github.com/konpyutaika/nifikop/releases
    helm:
      valuesObject:
        logLevel: Info
        # Namespaces the operator watches. Empty list = all namespaces
        # (requires cluster-scoped RBAC).
        namespaces:
          - nifi
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: nifikop
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zookeeper
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: registry-1.docker.io/bitnamicharts
    chart: zookeeper
    targetRevision: 13.8.5
    helm:
      valuesObject:
        replicaCount: 3
        persistence:
          enabled: true
          size: 8Gi
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: zookeeper
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: v1
kind: Namespace
metadata:
  name: nifi
---
apiVersion: nifi.konpyutaika.com/v1
kind: NifiCluster
metadata:
  name: nifi
  namespace: nifi
spec:
  service:
    headlessEnabled: true
    labels:
      cluster-name: nifi
  zkAddress: "zookeeper.zookeeper.svc.cluster.local:2181"
  zkPath: /nifi
  clusterImage: "apache/nifi:1.28.1"
  oneNifiNodePerNode: false
  readOnlyConfig:
    nifiProperties:
      webProxyHosts:
        - "nifi.xxx.local"
      overrideConfigs: |
        nifi.ui.banner.text="nifikop"
        nifi.sensitive.props.key="cSWtxWggSAHasdgEglIOnSwQ="
  nodeConfigGroups:
    default_group:
      isNode: true
      serviceAccountName: default
      storageConfigs:
        - mountPath: "/opt/nifi/data"
          name: data
          pvcSpec:
            accessModes:
              - ReadWriteOnce
            storageClassName: "standard"
            resources:
              requests:
                storage: 10Gi
        - mountPath: "/opt/nifi/nifi-current/logs"
          name: logs
          pvcSpec:
            accessModes:
              - ReadWriteOnce
            storageClassName: "standard"
            resources:
              requests:
                storage: 5Gi
        - mountPath: "/opt/nifi/flowfile_repository"
          name: flowfile-repository
          pvcSpec:
            accessModes:
              - ReadWriteOnce
            storageClassName: "standard"
            resources:
              requests:
                storage: 10Gi
        - mountPath: "/opt/nifi/content_repository"
          name: content-repository
          pvcSpec:
            accessModes:
              - ReadWriteOnce
            storageClassName: "standard"
            resources:
              requests:
                storage: 10Gi
        - mountPath: "/opt/nifi/provenance_repository"
          name: provenance-repository
          pvcSpec:
            accessModes:
              - ReadWriteOnce
            storageClassName: "standard"
            resources:
              requests:
                storage: 10Gi
      resourcesRequirements:
        requests:
          cpu: "1"
          memory: 2Gi
        limits:
          cpu: "2"
          memory: 4Gi
  nodes:
    - id: 0
      nodeConfigGroup: default_group
    - id: 1
      nodeConfigGroup: default_group
    - id: 2
      nodeConfigGroup: default_group
  propagateLabels: true
  nifiClusterTaskSpec:
    retryDurationMinutes: 10
  listenersConfig:
    internalListeners:
      - type: http
        name: http
        containerPort: 8080
      - type: cluster
        name: cluster
        containerPort: 6007
      - type: s2s
        name: s2s
        containerPort: 10000
      - type: prometheus
        name: prometheus
        containerPort: 9090
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nifi
  namespace: nifi
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - "nifi.xxx.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: nifi-cluster-ip
          port: 8080
