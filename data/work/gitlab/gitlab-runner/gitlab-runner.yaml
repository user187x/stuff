stages:
  - build
  - test
  - deploy

variables:
  GCP_PROJECT: your-gcp-project-id
  IMAGE_NAME: gcr.io/your-gcp-project-id/guestbook

# Build and Push Container
build_image:
  stage: build
  tags:
    - gcp-guestbook # Matches the runner tag
  script:
    - docker build -t $IMAGE_NAME .
    - echo $GCP_SERVICE_KEY | docker login -u _json_key --password-stdin https://gcr.io
    - docker push $IMAGE_NAME

# Deploy to Cloud Run (Example Target)
deploy_app:
  stage: deploy
  tags:
    - gcp-guestbook
  script:
    - gcloud auth activate-service-account --key-file=$GCP_SERVICE_KEY
    - gcloud config set project $GCP_PROJECT
    - gcloud run deploy guestbook --image $IMAGE_NAME --platform managed --region us-central1 --allow-unauthenticated
