apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nifi-cluster
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: ghcr.io/konpyutaika/helm-charts   # or your helmforge repo
    chart: nifi-cluster
    targetRevision: 1.14.1
    helm:
      valuesObject:
        cluster:
          nameOverride: "nifi-cluster"
          # ---------------- FIX #2 ----------------
          # Chart default is "nifi-cluster-zookeeper:2181" (a bundled ZK that
          # doesn't exist on your cluster). Point at the real service.
          zkAddress: "zookeeper.zookeeper.svc.cluster.local:2181"
          # ----------------------------------------
          zkPath: "/cluster"
          nifiProperties:
            # ---------------- FIX #4 ----------------
            # Must contain every hostname NiFi is reached through via Traefik,
            # or NiFi rejects the proxied request.
            webProxyHosts:
              - "nifi.xxx.local"
            # ----------------------------------------
  destination:
    server: https://kubernetes.default.svc
    namespace: nifi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
---
