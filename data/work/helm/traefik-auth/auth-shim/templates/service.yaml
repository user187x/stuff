apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-auth-shim
  labels:
    app.kubernetes.io/name: auth-shim
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: auth-shim
    app.kubernetes.io/instance: {{ .Release.Name }}
