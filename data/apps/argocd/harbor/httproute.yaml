apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: harbor
  namespace: harbor
spec:
  hostnames:
    - harbor.xxx.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  rules:
    # 1. Route Docker CLI & API V2 Traffic to the Registry
    - matches:
        - path: { type: PathPrefix, value: /v2/ }
      backendRefs:
        - name: harbor-registry
          port: 5000

    # 2. Route APIs, Auth, and Framework paths to Core Backend
    - matches:
        - path: { type: PathPrefix, value: /api/ }
        - path: { type: PathPrefix, value: /c/ }
        - path: { type: PathPrefix, value: /service/ }
        - path: { type: PathPrefix, value: /v1/ }
        - path: { type: PathPrefix, value: /chartrepo/ }
      backendRefs:
        - name: harbor-core
          port: 80

    # 3. Catch-all: Route everything else (HTML, JS, CSS) to the Portal Frontend
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: harbor-portal
          port: 80
