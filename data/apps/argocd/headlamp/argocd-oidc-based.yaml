apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://headlamp-k8s.github.io/headlamp'
    targetRevision: '0.24.0'
    chart: headlamp
    helm:
      values: |
        config:
          baseURL: "https://headlamp.xxx.com"
          oidc:
            clientID: "headlamp"
            clientSecret: "UiNETnNdOY96cyH5Xyd3ayjvrkrxoQ7FIOWIPCtMYMLGBeRu0RxCdqpiis8pfNbCniHK6hJ5VoEkZ23iAbmyUr"
            issuerURL: "https://keycloak.xxx.com/realms/master"
            scopes: "openid,profile,email,groups"
        # Disable the default Ingress to use Gateway API instead
        ingress:
          enabled: false
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: headlamp
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
