apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: coder-route
  namespace: coder
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - "coder.xxx.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: coder
          port: 80
