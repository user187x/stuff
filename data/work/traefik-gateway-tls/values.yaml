tlsStore:
  default:
    defaultCertificate:
      secretName: traefik-wildcard-cert

providers:
  kubernetesIngress:
    enabled: false
  kubernetesGateway:
    enabled: true
    experimentalChannel: false
    gatewayClassName: traefik

ports:
  web:
    port: 80
    expose:
      default: true
    redirectTo:
      port: websecure
      priority: 10
  websecure:
    port: 443
    expose:
      default: true
    # format: <namespace>-<name>@kubernetescrd
    middlewares:
      - traefik-pre-auth@kubernetescrd

gateway:
  enabled: true
  gatewayClassName: traefik
  listeners:
    web:
      port: 80
      namespacePolicy:
        from: All
    websecure:
      enabled: true
      port: 443
      protocol: HTTPS
      mode: Terminate
      namespacePolicy:
        from: All
      certificateRefs:
      - name: traefik-wildcard-cert
