server:

  extraArgs:
    - --insecure

  ingress:
    enabled: false

extraObjects:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: argocd
      # namespace is automatically injected by Helm
    spec:
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
          sectionName: https
      hostnames:
        - "argocd.xxx.com"
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - name: argocd-server
              port: 80
