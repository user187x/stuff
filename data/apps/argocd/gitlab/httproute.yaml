apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gitlab-route
  namespace: gitlab
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - "gitlab.xxx.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: gitlab-webservice-default
          port: 8181
