apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nifi-cluster-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1" # Ensures this runs after the operator
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: "https://github.com/your-org/your-nifi-gitops-repo.git"
    targetRevision: HEAD
    path: manifests/nifi-cluster
  destination:
    server: "https://kubernetes.default.svc"
    namespace: nifi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
