apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: elastic-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://helm.elastic.co
    chart: eck-operator-crds
    targetRevision: 2.11.1
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - Prune=false
