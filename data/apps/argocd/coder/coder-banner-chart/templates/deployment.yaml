apiVersion: apps/v1
kind: Deployment
metadata:
  name: coder-banner
  namespace: {{ include "coder-banner.namespace" . }}
  labels:
    {{- include "coder-banner.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: coder-banner
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "coder-banner.labels" . | nindent 8 }}
      annotations:
        # Restart when the service code changes; banner defaults are re-read on every request.
        checksum/app: {{ print (.Files.Get "files/banner.js") (.Files.Get "files/server.py") (.Files.Get "files/admin.html") (.Files.Get "files/app.js") (.Files.Get "files/app.css") | sha256sum | trunc 16 }}
    spec:
      serviceAccountName: coder-banner
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: banner
          image: {{ include "coder-banner.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python3", "/app/server.py"]
          env:
            - { name: PORT, value: "8080" }
            - { name: APP_DIR, value: /app }
            - { name: DEFAULTS_FILE, value: /config/banner.json }
            - { name: STATE_CONFIGMAP, value: coder-banner-state }
            - { name: CODER_URL, value: "http://{{ .Values.coder.service.name }}.{{ include "coder-banner.namespace" . }}.svc.cluster.local:{{ .Values.coder.service.port }}" }
            - { name: ADMIN_ROLES, value: {{ join "," .Values.admin.roles | quote }} }
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
            - { name: PYTHONUNBUFFERED, value: "1" }
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 96Mi }
          volumeMounts:
            - { name: app, mountPath: /app, readOnly: true }
            - { name: defaults, mountPath: /config, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: app
          configMap:
            name: coder-banner-app
        - name: defaults
          configMap:
            name: coder-banner-content
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: coder-banner
  namespace: {{ include "coder-banner.namespace" . }}
  labels:
    {{- include "coder-banner.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: coder-banner
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: http
