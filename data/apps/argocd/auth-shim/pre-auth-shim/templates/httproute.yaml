apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: protected-app-route
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - {{ .Values.httproute.spec.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: pre-auth-gate
      backendRefs:
        - name: {{ .Values.backendService.name }}
          namespace: {{ .Values.backendService.namespace }}
          port: {{ .Values.backendService.port }}

