# --- General Settings ---
unbind r

bind r source-file $HOME/.config/tmux/tmux.conf \; display "Reloaded!"

# Enable support for kitty terminal
set -s extended-keys on
set -g allow-passthrough on

set -g set-titles on
set -g set-titles-string " "

# Set [SPACEBAR] as [PREFIX-KEY]
set -g prefix C-Space
bind C-Space send-prefix

# Vertical split '-'
unbind -
bind-key - split-window -v


# Horizong split '='
unbind =
bind-key = split-window -h

# Force tmux to use a non-login shell to reach ~/.bashrc
set-option -g default-command "bash"

# Remove delay when pressing Esc (Crucial for Vim/Neovim)
set -s escape-time 0

# Disable repeat time to prevent accidental lingering keystrokes
set -g repeat-time 1

set-option -g default-terminal "tmux-256color"

# Allow true color (fixes weird shading/inconsistencies)
set-option -sa terminal-features ',xterm-kitty:RGB'

# Set the status bar background to default (makes it transparent)
set-option -g status-style "bg=default"

# Keep scrolling up/down from jumping around too far
bind-key -T copy-mode WheelUpPane send-keys -X -N 2 scroll-up
bind-key -T copy-mode WheelDownPane send-keys -X -N 2 scroll-down

# Destroy the session when the last client detaches (e.g., closing the terminal window)
set-option -g destroy-unattached on

# Focus events enabled for terminals that support them
set -g focus-events on

# Super useful when using "grouped sessions" and multi-monitor setup
setw -g aggressive-resize on

# Optimization: Refresh status line faster for Dracula
set -g status-interval 1

# Window/Pane Management
setw -g xterm-keys on

setw -g automatic-rename on
set-option -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

# Vim-like Navigation
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'dracula/tmux'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin '2kabhishek/tmux-tilit'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'pschmitt/tmux-ssh-split'

# for a more aggressive dim, or #1a1b26 for something gentler.
set -g @black "#1e1f29"

set -g @catppuccin_window_status_style "rounded"

# is a valid colour name for any other @dracula-* colour pair.
set -gF @dracula-colors "black='#{@black}'"

set -g @dracula-network-bandwidth "wlp192s0"
set -g @dracula-network-bandwidth-interval 1
set -g @dracula-network-bandwidth-show-interface false

set -g @dracula-show-powerline true
set -g @dracula-show-flags true
set -g @dracula-show-left-icon "#(date +'%a %m/%d/%y %I:%M %p')"

set -g @dracula-plugins "network-bandwidth cpu-usage ram-usage gpu-usage"
set -g status-position top

#set -g @dracula-network-bandwidth-label "NET"
set -g @dracula-cpu-label "CPU"
set -g @dracula-gpu-label "GPU"
set -g @dracula-gpu-usage-colors "orange dark_gray"
set -g @dracula-cpu-usage-colors "pink dark_gray"
set -g @dracula-network-bandwidth-colors "yellow dark_gray"
set -g @dracula-no-battery-label "orange dark_gray"

# Formatting
set -g @dracula-show-window-index false
set -g @dracula-pane-index '#W'
set -g @dracula-window-format '#W'
set -g @dracula-refresh-rate 1


# --- Initialize TMUX Plugin Manager ---
run '$HOME/.config/tmux/plugins/tpm/tpm'

# ==========================================
# OVERRIDES (MUST BE AFTER TPM)
# ==========================================

# 1. Enable Bottom Border
set-option -g pane-border-status bottom

# 2. Active border — mode-aware coloring:
#    pink   (#ff79c6) while in copy mode
#    yellow (#f1fa8c) while the prefix key is held
#    green  (#5fff87) normally
set -g pane-active-border-style "bg=default,#{?pane_in_mode,fg=#ff79c6,#{?client_prefix,fg=#f1fa8c,fg=#5fff87}}"
set -g pane-border-style        "bg=default fg=#4e4e4e"

unbind |
bind-key | split-window -v

# 2a. Heavier border lines + arrows drawn by tmux pointing AT the active pane.
# pane-border-lines values: single | double | heavy | simple | number
set -g pane-border-lines        heavy
set -g pane-border-indicators   both

# 3. Custom border script for the ACTIVE pane (runs term_info — pstree,
run-shell 'tmux set-option -g @term_info $HOME/.config/tmux/scripts/term_info'

#================================================================================

# don't pile up daemons; the loop also self-terminates when tmux exits.
#set -g @spinner_l "⠋"
#set -g @spinner_r "⠏"
#run-shell -b '$HOME/.config/tmux/scripts/spinner_daemon'

# Static version safe for all systems. No background scripts executed.
set -g @spinner_l ""
set -g @spinner_r ""

#================================================================================

# 3b. Pane border format: left spinner + term_info, right spinner (or
# (reverse), giving the mirrored / opposing-direction effect.
set-window-option -g pane-border-format "#{?pane_active,#[fg=#5fff87]#{@spinner_l} #[fg=default]#( #{@term_info} #{pane_pid} #{pane_current_path} ),#[fg=#6272a4] #{pane_current_command} · #{b:pane_current_path}}#{?window_zoomed_flag,#[align=right]#[fg=red] ZOOMED #[default],#{?pane_active,#[align=right]#[fg=#5fff87]#{@spinner_r} ↑━,}}"

# 4. Dim inactive panes — bg painted with our new @black, fg muted to the
set -gF window-style        "bg=#{@black},fg=#6272a4"
set -g  window-active-style "bg=default,fg=#f8f8f2"

# 5. Bigger, longer-lasting pane picker (prefix + q), in theme colors.
set -g display-panes-time           2000
set -g display-panes-active-colour  "#5fff87"
set -g display-panes-colour         "#6272a4"

# 6. Redraw the status line the instant focus changes between panes,
# so anything driven by #{?pane_active,...} reacts immediately instead of
set-hook -g after-select-pane "refresh-client -S"

# 2. OVERRIDE THEME FOR TRANSPARENCY (Must be at the very bottom)
set -g window-style bg=default
set -g window-active-style bg=default
