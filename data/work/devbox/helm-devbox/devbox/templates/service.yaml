apiVersion: v1
kind: Service
metadata:
  name: {{ include "devbox.fullname" . }}
  labels:
    {{- include "devbox.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.novncPort }}
      targetPort: novnc
      protocol: TCP
      name: novnc
    - port: {{ .Values.service.filebrowserPort }}
      targetPort: filebrowser
      protocol: TCP
      name: filebrowser
  selector:
    {{- include "devbox.selectorLabels" . | nindent 4 }}
