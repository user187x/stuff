apiVersion: v1
kind: ServiceAccount
metadata:
  name: banner-syncer
  namespace: excalidraw
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: banner-syncer-role
  namespace: excalidraw
rules:
  - apiGroups: ["traefik.io", "traefik.containo.us"]
    resources: ["middlewares"]
    verbs: ["get", "patch", "update", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: banner-syncer-binding
  namespace: excalidraw
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: banner-syncer-role
subjects:
  - kind: ServiceAccount
    name: banner-syncer
