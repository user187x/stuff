# Chart defaults for the banner (from values.yaml), used until an admin publishes something.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coder-banner-content
  namespace: {{ include "coder-banner.namespace" . }}
  labels:
    {{- include "coder-banner.labels" . | nindent 4 }}
data:
  banner.json: |
    {{- dict
        "enabled" .Values.banner.enabled
        "id" (include "coder-banner.id" .)
        "level" .Values.banner.level
        "title" .Values.banner.title
        "message" .Values.banner.message
        "linkText" .Values.banner.linkText
        "linkUrl" .Values.banner.linkUrl
        "dismissible" .Values.banner.dismissible
        "showOnLoginPage" .Values.banner.showOnLoginPage
        "refreshSeconds" .Values.banner.refreshSeconds
      | toPrettyJson | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coder-banner-app
  namespace: {{ include "coder-banner.namespace" . }}
  labels:
    {{- include "coder-banner.labels" . | nindent 4 }}
data:
  {{- range $name := list "banner.js" "server.py" "admin.html" "app.js" "app.css" }}
  {{ $name }}: |
    {{- $.Files.Get (printf "files/%s" $name) | nindent 4 }}
  {{- end }}
---
# What an admin publishes from the admin page (state.json). Helm only owns the metadata: it never
# renders `data`, so a `helm upgrade` cannot overwrite a published banner.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coder-banner-state
  namespace: {{ include "coder-banner.namespace" . }}
  labels:
    {{- include "coder-banner.labels" . | nindent 4 }}
