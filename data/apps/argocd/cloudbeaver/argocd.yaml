apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudbeaver
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://avistotelecom.github.io/charts/
    targetRevision: 1.1.7
    chart: cloudbeaver
    helm:
      values: |
        extraObjects:
          - apiVersion: gateway.networking.k8s.io/v1
            kind: HTTPRoute
            metadata:
              name: cloudbeaver
            spec:
              parentRefs:
                - name: traefik-gateway
                  namespace: traefik
              hostnames:
                - "cloudbeaver.xxx.com"
              rules:
                - matches:
                    - path:
                        type: PathPrefix
                        value: /
                  backendRefs:
                    - name: cloudbeaver
                      port: 8978
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudbeaver
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
