apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis-operator
  namespace: argocd
spec:
  template:
    metadata:
      name: redis-operator
      labels:
        infrastructure: database-operator
    spec:
      project: default
      source:
        repoURL: https://ot-container-kit.github.io/helm-charts
        chart: redis-operator
        targetRevision: 0.25.0
        helm:
          values: |
            redisOperator:
              # An empty string sets the operator to watch all namespaces,
              # allowing any team to provision Redis instances in their own namespace.
              watchNamespace: ""

            # If you are using cert-manager cluster-wide, leave this true.
            # If cert-manager is not installed, set to false to auto-generate a self-signed cert.
            webhook: true

            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 256Mi
      destination:
        server: https://kubernetes.default.svc
        namespace: redis-operator
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
