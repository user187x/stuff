{
  "apiVersion": "argoproj.io/v1alpha1",
  "kind": "Application",
  "metadata": {
    "name": "headlamp",
    "namespace": "argocd"
  },
  "spec": {
    "destination": {
      "namespace": "headlamp",
      "server": "https://kubernetes.default.svc"
    },
    "project": "default",
    "source": {
      "chart": "headlamp",
      "helm": {
        "values": "service:\n  type: LoadBalancer\n\n# Disable the chart's default ServiceAccount so your custom one takes over cleanly\nserviceAccount:\n  create: false\n  name: headlamp-admin\n\nextraManifests:\n  - |\n    apiVersion: v1\n    kind: ServiceAccount\n    metadata:\n      name: headlamp-admin\n      namespace: headlamp\n      annotations:\n        argocd.argoproj.io/sync-wave: \"-1\"\n  - |\n    apiVersion: rbac.authorization.k8s.io/v1\n    kind: ClusterRoleBinding\n    metadata:\n      name: headlamp-admin\n      annotations:\n        argocd.argoproj.io/sync-wave: \"-1\"\n    roleRef:\n      apiGroup: rbac.authorization.k8s.io\n      kind: ClusterRole\n      name: cluster-admin\n    subjects:\n      - kind: ServiceAccount\n        name: headlamp-admin\n        namespace: headlamp\n"
      },
      "repoURL": "https://kubernetes-sigs.github.io/headlamp/",
      "targetRevision": "0.43.0"
    },
    "syncPolicy": {
      "automated": {
        "prune": true,
        "selfHeal": true
      },
      "syncOptions": [
        "CreateNamespace=true"
      ]
    }
  }
}
