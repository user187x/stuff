apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitlab
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://charts.gitlab.io/'
    targetRevision: '10.2.0'
    chart: gitlab
    helm:
      valuesObject:
        global:
          hosts:
            domain: xxx.com
            https: true
          ingress:
            enabled: false
            configureCertmanager: false
          gatewayApi:
            enabled: true
            installEnvoy: false
          psql:
            host: gitlab-db-rw.gitlab.svc.cluster.local
            database: gitlab
            username: gitlab
            password:
              secret: gitlab-db-app
              key: password
          redis:
            host: redis.redis.svc.cluster.local

          # Disable features that strictly require S3 Object Storage
          appConfig:
            lfs:
              enabled: false
            artifacts:
              enabled: false
            uploads:
              enabled: false
            packages:
              enabled: false

        # Disable the Container Registry (Root level, not global)
        registry:
          enabled: false

        gitlab:
          toolbox:
            backups:
              cron:
                enabled: false
              objectStorage:
                config:
                  secret: "bypass-helm-check"
          gitaly:
            persistence:
              storageClass: standard

        installCertmanager: false
        certmanager-issuer:
          email: admin@xxx.com

        nginx-ingress:
          enabled: false
        postgresql:
          install: false
        redis:
          install: false

        prometheus:
          server:
            persistentVolume:
              storageClass: standard

        gatewayApiResources:
          class:
            name: traefik
            controllerName: traefik.io/gateway-controller
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: gitlab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
