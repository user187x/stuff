{{- if .Values.dbUrlSecret.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.dbUrlSecret.name | default "coder-db-url" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "coder-umbrella.labels" . | nindent 4 }}
  annotations:
    # Allow ArgoCD to track ownership without rewriting the secret on every sync
    # if you later switch to an external secret manager (ESO, Vault, etc.).
    argocd.argoproj.io/sync-wave: "-5"
type: Opaque
stringData:
  url: {{ include "coder-umbrella.dbUrl" . | quote }}
{{- end }}
