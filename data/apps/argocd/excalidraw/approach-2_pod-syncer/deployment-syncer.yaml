apiVersion: apps/v1
kind: Deployment
metadata:
  name: banner-syncer
  namespace: excalidraw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: banner-syncer
  template:
    metadata:
      labels:
        app: banner-syncer
    spec:
      serviceAccountName: banner-syncer
      containers:
        - name: syncer
          image: bitnami/kubectl:latest
          command:
            - /bin/sh
            - -c
            - |
              LAST_TEXT=""
              while true; do
                # Read the current value from the mounted ConfigMap
                NEW_TEXT=$(cat /config/bannertext)

                # If the text has changed, update the Traefik Middleware
                if [ "$NEW_TEXT" != "$LAST_TEXT" ]; then
                  echo "ConfigMap change detected. Updating banner to: $NEW_TEXT"

                  cat <<EOF | kubectl apply -f -
              apiVersion: traefik.io/v1alpha1
              kind: Middleware
              metadata:
                name: banner
                namespace: excalidraw
              spec:
                plugin:
                  rewritebody:
                    lastModified: true
                    rewrites:
                      - regex: "<body>"
                        replacement: '<body><style>#root{position:absolute !important;top:40px !important;height:calc(100% - 40px) !important;width:100% !important;}#subscription-banner{position:fixed !important;top:0 !important;left:0 !important;right:0 !important;height:40px !important;background-color:#0f766e !important;color:#ffffff !important;font-family:sans-serif !important;font-size:14px !important;font-weight:500 !important;display:flex !important;align-items:center !important;justify-content:center !important;z-index:2147483647 !important;}</style><div id="subscription-banner">${NEW_TEXT}</div>'
              EOF

                  LAST_TEXT="$NEW_TEXT"
                fi
                sleep 10
              done
          volumeMounts:
            - name: config-volume
              mountPath: /config
      volumes:
        - name: config-volume
          configMap:
            name: banner-config
