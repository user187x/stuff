apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitlab
  namespace: argocd
spec:
  project: default
  source:
    chart: gitlab
    repoURL: https://charts.gitlab.io/
    targetRevision: '*'
    helm:
      values: |
        global:
          hosts:
            domain: gitlab.xxx.local
          ingress:
            enabled: false
            configureCertmanager: false

        nginx-ingress:
          enabled: false

        # This is the ONLY place cert-manager should be referenced
        installCertmanager: false

        prometheus:
          install: false

        registry:
          enabled: false
        gitlab:
          toolbox:
            enabled: false
            backups:
              cron:
                enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: gitlab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
