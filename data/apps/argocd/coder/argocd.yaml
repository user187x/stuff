apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: coder
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://helm.coder.com/v2
    chart: coder
    targetRevision: 2.36.0
    helm:
      values: |
        coder:

          env:
            - name: CODER_ACCESS_URL
              value: "https://coder.xxx.com"
            - name: CODER_PG_CONNECTION_URL
              valueFrom:
                secretKeyRef:
                  name: coder-db-app
                  key: uri

          service:
            type: ClusterIP

          httproute:
            enable: true
            host: "coder.xxx.com"
            parentRefs:
              - name: traefik-gateway
                namespace: traefik
                kind: Gateway
                group: gateway.networking.k8s.io

        extraTemplates:
          - |
            apiVersion: postgresql.cnpg.io/v1
            kind: Cluster
            metadata:
              name: coder-db
            spec:
              instances: 2
              primaryUpdateStrategy: unsupervised
              storage:
                size: 10Gi
                storageClass: standard-k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: coder
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
