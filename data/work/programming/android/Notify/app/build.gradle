plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.xxx.notify'
    compileSdk 36

    defaultConfig {
        applicationId "com.xxx.notify"
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildFeatures {
        compose true
    }

    packaging {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
            excludes += "/META-INF/NOTICE.md"
            excludes += "/META-INF/LICENSE.md"
            excludes += "/META-INF/DEPENDENCIES"
        }
    }
}

dependencies {

    implementation 'com.google.android.gms:play-services-auth:21.2.0'
    // Google API Client for Gmail
    implementation 'com.google.http-client:google-http-client-android:1.44.2'
    implementation 'com.google.api-client:google-api-client-android:2.4.0'
    implementation 'com.google.apis:google-api-services-gmail:v1-rev20220404-2.0.0'
    // JavaMail (still needed to build the email message structure)
    implementation("com.sun.mail:android-mail:1.6.7")
    implementation("com.sun.mail:android-activation:1.6.7")
    implementation("com.google.android.material:material:1.12.0")
    implementation("com.sun.mail:android-mail:1.6.7")
    implementation("com.sun.mail:android-activation:1.6.7")
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.ui
    implementation libs.androidx.ui.graphics
    implementation libs.androidx.ui.tooling.preview
    implementation libs.androidx.material3
    implementation libs.androidx.appcompat
    debugImplementation libs.androidx.ui.tooling
}