# ====================================================================
# File System Max Capacity
# ====================================================================

# Maximize system-wide file descriptor allocations
fs.file-max = 2097152

# Maximize file descriptor allocations for local pipes
fs.pipe-max-size = 4194104

# ====================================================================
# Network Stack & Maximum Buffer Sizes
# ====================================================================
# Maximize the read/write socket buffer sizes (e.g., up to 16MB/64MB)
net.core.rmem_max = 67108864
net.core.wmem_max = 67108864

# Set maximum auto-tuning buffer bounds for TCP sockets (Min, Default, Max)
net.ipv4.tcp_rmem = 4096 87380 67108864
net.ipv4.tcp_wmem = 4096 65536 67108864

# Maximize connection backlog limits for handling traffic spikes
net.core.somaxconn = 65535
net.ipv4.tcp_max_syn_backlog = 65535

# ====================================================================
# System V IPC & Memory Limits
# ====================================================================
# Maximum size of a single shared memory segment (e.g., for 64GB RAM)
kernel.shmmax = 68719476735

# Maximum total allocated shared memory pages system-wide
kernel.shmall = 16777216

# Maximum number of system-wide message queues
kernel.msgmni = 32768

# I dont know
fs.inotify.max_user_watches=1048576
fs.inotify.max_user_instances=8192
