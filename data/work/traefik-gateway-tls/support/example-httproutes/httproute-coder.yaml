---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: coder-route
  namespace: coder
spec:
  parentRefs:
  - name: traefik
    namespace: traefik
  hostnames:
  - "coder.feed.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: coder
      port: 80 # Update this if your Coder service uses a different port (e.g., 8080)
