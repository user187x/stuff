apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3" # Ensures CRDs deploy before controllers or routes
spec:
  project: default
  source:
    repoURL: 'https://github.com/kubernetes-sigs/gateway-api.git'
    targetRevision: v1.6.0 # Replace with the desired Gateway API version release tag
    path: config/crd/standard # Use config/crd/experimental if you need TCPRoute/TLSRoute/UDPRoute
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kube-system # CRDs are cluster-scoped, but ArgoCD requires a destination namespace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true # CRITICAL: Prevents 'Too long: must have at most 262144 bytes' annotation error
