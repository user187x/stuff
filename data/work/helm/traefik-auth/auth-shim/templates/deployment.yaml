apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-auth-shim
  labels:
    app.kubernetes.io/name: auth-shim
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-shim
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-shim
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: auth-shim
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: AUTH_SHIM_PORT
              value: "8080"
            - name: VALIDATOR_URL
              value: {{ .Values.validator.url | quote }}
            {{- if .Values.validator.tlsSecretName }}
            - name: TLS_CRT_PATH
              value: "/etc/certs/tls.crt"
          volumeMounts:
            - name: validator-certs
              mountPath: /etc/certs
              readOnly: true
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.validator.tlsSecretName }}
      volumes:
        - name: validator-certs
          secret:
            secretName: {{ .Values.validator.tlsSecretName }}
      {{- end }}
