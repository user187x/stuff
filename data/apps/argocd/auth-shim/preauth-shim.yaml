apiVersion: v1
kind: ConfigMap
metadata:
  name: pre-auth-code
  namespace: pre-auth
data:
  app.py: |
    import asyncio
    import uuid
    from fastapi import FastAPI, Request, HTTPException
    from fastapi.responses import HTMLResponse, JSONResponse

    app = FastAPI()

    # Dictionary to hold pending requests in memory
    pending_requests = {}

    @app.get("/auth")
    @app.get("/verify")
    async def handle_auth(request: Request):
        req_id = str(uuid.uuid4())
        event = asyncio.Event()

        # Capture headers Traefik passes to the ForwardAuth middleware
        headers = dict(request.headers)
        uri = headers.get("x-forwarded-uri", "Unknown")
        ip = headers.get("x-forwarded-for", "Unknown")

        pending_requests[req_id] = {
            "event": event,
            "decision": None,
            "uri": uri,
            "ip": ip,
            "id": req_id
        }

        # Hang the request until the UI triggers the event, or timeout after 60s
        try:
            await asyncio.wait_for(event.wait(), timeout=60.0)
        except asyncio.TimeoutError:
            pending_requests.pop(req_id, None)
            raise HTTPException(status_code=403, detail="Timeout waiting for admin approval")

        decision = pending_requests.pop(req_id, {}).get("decision")

        if decision == "approve":
            return JSONResponse({"status": "approved"}, status_code=200)
        else:
            raise HTTPException(status_code=403, detail="Denied by admin UI")

    @app.get("/ui", response_class=HTMLResponse)
    async def ui():
        # Simple polling UI to display requests and push decisions
        return """
        <html>
        <head>
            <title>Auth Shim UI</title>
            <style>
                body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #d4d4d4; }
                .req { border: 1px solid #333; padding: 15px; margin-bottom: 10px; background: #252526; }
                button { padding: 8px 15px; margin-right: 10px; cursor: pointer; border: none; font-weight: bold; }
                .approve { background: #4CAF50; color: white; }
                .deny { background: #f44336; color: white; }
            </style>
        </head>
        <body>
            <h2>Pending Traefik Requests</h2>
            <div id="requests"></div>
            <script>
                async function fetchRequests() {
                    let res = await fetch('/api/requests');
                    let data = await res.json();
                    let div = document.getElementById('requests');
                    div.innerHTML = '';
                    for (let id in data) {
                        let req = data[id];
                        div.innerHTML += `<div class="req">
                            <strong>IP:</strong> ${req.ip} <br>
                            <strong>URI:</strong> ${req.uri} <br><br>
                            <button class="approve" onclick="decide('${id}', 'approve')">Approve</button>
                            <button class="deny" onclick="decide('${id}', 'deny')">Deny</button>
                        </div>`;
                    }
                }
                async function decide(id, action) {
                    await fetch(`/api/decide/${id}/${action}`, {method: 'POST'});
                    fetchRequests();
                }
                setInterval(fetchRequests, 2000);
                fetchRequests();
            </script>
        </body>
        </html>
        """

    @app.get("/api/requests")
    async def get_requests():
        # Filter out the un-serializable asyncio.Event object for the API response
        return {k: {"id": v["id"], "uri": v["uri"], "ip": v["ip"]} for k, v in pending_requests.items()}

    @app.post("/api/decide/{req_id}/{action}")
    async def decide_request(req_id: str, action: str):
        if req_id in pending_requests and action in ["approve", "deny"]:
            pending_requests[req_id]["decision"] = action
            pending_requests[req_id]["event"].set() # This releases the hanging /auth request
            return {"status": "ok"}
        raise HTTPException(status_code=404, detail="Request not found or already processed")
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pre-auth-shim
  namespace: pre-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pre-auth-shim
  template:
    metadata:
      labels:
        app: pre-auth-shim
    spec:
      containers:
        - name: shim
          image: python:3.11-alpine
          command: ["/bin/sh", "-c"]
          args:
            [
              "pip install fastapi uvicorn && uvicorn app:app --host 0.0.0.0 --port 8080",
            ]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: code-volume
              mountPath: /app
          workingDir: /app
      volumes:
        - name: code-volume
          configMap:
            name: pre-auth-code
---
apiVersion: v1
kind: Service
metadata:
  name: pre-auth-shim-svc
  namespace: pre-auth
spec:
  selector:
    app: pre-auth-shim
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: pre-auth-gate
  namespace: pre-auth
spec:
  forwardAuth:
    address: http://pre-auth-shim-svc.pre-auth.svc.cluster.local/auth
    trustForwardHeader: true
    authResponseHeaders:
      - X-Forwarded-User
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: protected-route
  namespace: pre-auth
spec:
  parentRefs:
    - name: traefik-gateway # Replace with the name of your Gateway resource
      namespace: traefik
  hostnames:
    - "sensitve.xxx.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.containo.us
            kind: Middleware
            name: pre-auth-gate
      backendRefs:
        - name: headlamp # The service you are protecting
          port: 80
