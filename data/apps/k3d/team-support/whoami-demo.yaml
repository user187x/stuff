# =============================================================================
# whoami-demo.yaml — reference deployment for teams onboarding to the platform
# =============================================================================
# Deploy with:   kubectl apply -f whoami-demo.yaml
# Browse at:     https://whoami.xxx.local/
#                (add "127.0.0.1 whoami.xxx.local" to /etc/hosts, or re-run
#                 ./tnl-web which discovers HTTPRoute hostnames automatically)
#
# Everything in this file lives in YOUR OWN namespace. You never touch the
# platform's Gateway, GatewayClass, TLS secret, or the traefik namespace.
# The ONLY contract between you and the platform is the HTTPRoute at the
# bottom — the three fields marked ★ are what you change for your project.
# =============================================================================
---
apiVersion: v1
kind: Namespace
metadata:
  name: whoami
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: whoami
  labels:
    app: whoami
spec:
  replicas: 2
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10
          ports:
            - name: http
              containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: whoami
spec:
  selector:
    app: whoami
  ports:
    - name: http
      port: 80
      targetPort: http
---
# =============================================================================
# THE ROUTING CONTRACT — this is the piece every team writes for themselves.
# =============================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami-route          # any name; keep it in your own namespace
  namespace: whoami
spec:
  # ── Attach to the platform's shared Gateway ────────────────────────────────
  # These two values are FIXED for this cluster. The Gateway lives in the
  # 'traefik' namespace and allows routes from ALL namespaces, so a
  # cross-namespace parentRef like this just works (no ReferenceGrant needed
  # for the parentRef direction).
  parentRefs:
    - name: traefik-gateway
      namespace: traefik

  # ── ★ 1. Your hostname ─────────────────────────────────────────────────────
  # Must be a subdomain of xxx.local — the Gateway listener is bound to
  # "*.xxx.local" and TLS is terminated there with the platform's wildcard
  # cert. Pick anything unused: <yourapp>.xxx.local. You do NOT create any
  # TLS secret; HTTPS is already handled before traffic reaches you.
  hostnames:
    - whoami.xxx.local

  rules:
      # ── ★ 2 & 3. Your backend Service and its port ────────────────────────
      # Must be in the SAME namespace as this HTTPRoute. Cross-namespace
      # backends are possible but require a ReferenceGrant in the target
      # namespace — avoid unless you need it.
    - backendRefs:
        - name: whoami
          port: 80
