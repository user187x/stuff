apiVersion: apps/v1
kind: Deployment
metadata:
  name: pre-auth-shim
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pre-auth-shim
  template:
    metadata:
      labels:
        app: pre-auth-shim
    spec:
      containers:
      - name: shim
        image: python:3.11-alpine
        command: ["/bin/sh", "-c"]
        args: ["pip install fastapi uvicorn && uvicorn app:app --host 0.0.0.0 --port 8080"]
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: code-volume
          mountPath: /app
        workingDir: /app
      volumes:
      - name: code-volume
        configMap:
          name: pre-auth-shim-code
