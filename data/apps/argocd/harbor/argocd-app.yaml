apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://helm.goharbor.io'
    targetRevision: 1.19.1
    chart: harbor
    helm:
      values: |
        caSecretName: "ca.crt"
        persistence:
          enabled: true
          persistentVolumeClaim:
            registry:
              storageClass: "standard"
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: harbor
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
