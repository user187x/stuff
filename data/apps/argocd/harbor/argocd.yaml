# Harbor: a local container registry AND Helm chart repository (charts are stored as OCI artifacts) for testing
# the air-gapped pipeline end to end. Installed by Argo CD; TLS is terminated at the Traefik Gateway with the
# wildcard certificate, and the chart itself creates the HTTPRoute (expose.type: route).
#
# Every generated secret is supplied by an existing Secret created by ./install, so no password is in git and
# Argo CD has nothing random to fight over on re-render.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://helm.goharbor.io
    targetRevision: 1.19.2
    chart: harbor
    helm:
      values: |
        expose:
          type: route                       # Gateway API HTTPRoute (/v2, /api, /service, /c -> core; / -> portal)
          tls:
            enabled: false                  # TLS is terminated at the Traefik Gateway
          route:
            hosts:
              - harbor.xxx.com
            parentRefs:
              - group: gateway.networking.k8s.io
                kind: Gateway
                name: traefik-gateway
                namespace: traefik
                sectionName: https

        externalURL: https://harbor.xxx.com

        # Secrets created by ./install (keys documented in the chart's values.yaml)
        existingSecretAdminPassword: harbor-admin
        existingSecretSecretKey: harbor-secretkey
        core:
          existingSecret: harbor-core-secret
          existingXsrfSecret: harbor-core-xsrf
          secretName: harbor-token-tls
        jobservice:
          existingSecret: harbor-jobservice-secret
        registry:
          existingSecret: harbor-registry-secret
          credentials:
            username: harbor_registry_user
            existingSecret: harbor-registry-credentials
        database:
          internal:
            existingSecret: harbor-database

        trivy:
          enabled: false                    # vulnerability scanning: not needed here, saves memory and a large download

        persistence:
          persistentVolumeClaim:
            registry:
              size: 10Gi
            jobservice:
              jobLog:
                size: 1Gi
            database:
              size: 2Gi
            redis:
              size: 1Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: harbor
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
