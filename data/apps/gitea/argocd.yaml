apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitea
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://dl.gitea.com/charts'
    targetRevision: 10.3.0
    chart: gitea
    helm:
      valuesObject:
        ingress:
          enabled: false
        gitea:
          config:
            server:
              DOMAIN: "gitea.xxx.local"
              ROOT_URL: "http://gitea.xxx.local/"
              SSH_DOMAIN: "gitea.xxx.local"
        extraDeploy:
          - apiVersion: gateway.networking.k8s.io/v1
            kind: HTTPRoute
            metadata:
              name: gitea-httproute
              namespace: gitea
            spec:
              parentRefs:
                - name: traefik-gateway
                  namespace: traefik
              hostnames:
                - "gitea.xxx.local"
              rules:
                - matches:
                    - path:
                        type: PathPrefix
                        value: /
                  backendRefs:
                    - name: gitea-http
                      port: 3000
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: gitea
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
