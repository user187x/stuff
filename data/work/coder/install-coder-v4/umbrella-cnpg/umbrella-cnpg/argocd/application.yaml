apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: coder-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: http://gitlab.192.168.49.2.nip.io/root/coder-umbrella.git
    targetRevision: main
    path: umbrella-cnpg                                  # path to this chart
    helm:
      releaseName: coder
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: coder

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  ignoreDifferences:
    # CNPG continuously updates Cluster.status; don't fight the operator.
    - group: postgresql.cnpg.io
      kind: Cluster
      jsonPointers:
        - /status
    # The operator owns its webhook caBundle.
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - '.webhooks[].clientConfig.caBundle'
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - '.webhooks[].clientConfig.caBundle'
