apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-gateway-api-crds
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://wiremind.github.io/wiremind-helm-charts'
    targetRevision: 1.6.0
    chart: gateway-api-crds
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kube-system # Updated to kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
