---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: banner
  namespace: coder
spec:
  plugin:
    rewrite-body:
      lastModified: true
      rewrites:
        - regex: '(<div class="flex flex-col min-h-screen justify-between">)'
          replacement: '$1<div style="background-color: #0f766e; color: #ffffff; padding: 12px 20px; font-family: sans-serif; font-size: 14px; font-weight: 500; display: flex; align-items: center; justify-content: space-between; z-index: 99999; position: relative; width: 100%; box-sizing: border-box; flex-shrink: 0;"><span>Reminder: your subscription expires in 22 days. Renew to avoid account suspension.</span></div>'
