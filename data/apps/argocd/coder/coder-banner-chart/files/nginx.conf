server {
    listen 8080;
    server_name _;

    # Only the loader and its config are served; everything else is Coder's.
    location = /__banner/banner.js {
        alias /usr/share/banner/static/banner.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache";
    }

    location = /__banner/banner.json {
        alias /usr/share/banner/content/banner.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
