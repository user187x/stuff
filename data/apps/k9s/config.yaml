k9s:
  defaultView: "pods all"
  cluster: minikube
  body:
    fgColor: default
    bgColor: default
  prompt:
    fgColor: aqua
    bgColor: default
  dialog:
    fgColor: white
    bgColor: blue
  ui:
    skin: gruvbox-dark
    enableMouse: false
    headless: true
    logoless: true
    crumbsless: true
  refreshRate: 1
  maxRequestsPerSecond: 15
  logger:
    tail: 500
    buffer: 5000
    sinceSeconds: 600
    fullScreen: true
    textWrap: false
    showTime: true
  shellPod:
    image: busybox:latest
    namespace: default
    limits:
      cpu: 100m
      memory: 100Mi
  clusters:
    minikube:
      skin: nord
      namespace:
        active: all
      view:
        active: pods
  thresholds:
    cpu:
      critical: 90
      warn: 75
    memory:
      critical: 90
      warn: 75
  views:
    v1/pods:
      sortColumn: AGE:desc
    table:
      header:
        fgColor: white
        bgColor: default
