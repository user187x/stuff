apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.21.0
    helm:
      values: |
        # 1. Install Custom Resource Definitions (CRDs)
        installCRDs: true

        # 2. High Availability for the Controller
        replicaCount: 1
        podDisruptionBudget:
          enabled: false
          minAvailable: 1

        # 3. High Availability for the Webhook
        webhook:
          replicaCount: 1
          podDisruptionBudget:
            enabled: false
            minAvailable: 1

        # 4. High Availability for the CA Injector
        cainjector:
          replicaCount: 1
          podDisruptionBudget:
            enabled: false
            minAvailable: 1

        # 5. Production Resource Limits & Requests (Tune to your cluster)
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        webhook:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
        cainjector:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # ServerSideApply is highly recommended for cert-manager because its
      # CRDs are too large for standard client-side apply annotations.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
