---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secretsmanager
  namespace: traefik
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1 # Update to your specific AWS region
      auth:
        jwt:
          serviceAccountRef:
            # This service account must be annotated with your AWS IAM Role ARN
            name: external-secrets-sa
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: traefik-wildcard-cert-es
  namespace: traefik
spec:
  refreshInterval: 1h # How often ESO checks AWS for updates
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: traefik-wildcard-cert # The name of the K8s Secret Traefik will consume
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef:
        key: traefik/wildcard-cert
        property: tls.crt
    - secretKey: tls.key
      remoteRef:
        key: traefik/wildcard-cert
        property: tls.key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: traefik-ca-bundle-es
  namespace: traefik
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    # ESO will generate a K8s Secret named 'traefik-ca-bundle'
    name: traefik-ca-bundle
  data:
    - secretKey: ca.crt
      remoteRef:
        key: traefik/ca-bundle
        property: ca.crt
